<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="Attack surface map: the orchestrator routes each request to the matching skill">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1526"/><stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#6366F1" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="470" rx="16" fill="url(#ink)"/>
  <rect width="1000" height="470" rx="16" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="999" height="469" rx="16" fill="none" stroke="#22D3EE" stroke-opacity="0.14"/>

  <text x="40" y="52" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13" letter-spacing="3" fill="#67E8F9">ROUTING</text>
  <text x="40" y="82" font-family="Inter,system-ui,sans-serif" font-size="26" font-weight="700" fill="#F5F7FA">One request → the right surface</text>

  <!-- connectors (drawn first, behind nodes) -->
  <g stroke="url(#hub)" stroke-width="2" opacity="0.6" fill="none" stroke-dasharray="7 7">
    <animate attributeName="stroke-dashoffset" values="0;-28" dur="1.3s" repeatCount="indefinite"/>
    <path d="M500 260 C 360 260, 340 200, 300 200"/>
    <path d="M420 275 C 320 275, 300 275, 258 275"/>
    <path d="M500 290 C 360 300, 345 350, 300 350"/>
    <path d="M500 260 C 640 260, 660 200, 700 200"/>
    <path d="M580 275 C 680 275, 700 275, 742 275"/>
    <path d="M500 290 C 640 300, 655 350, 700 350"/>
  </g>

  <!-- domain skill nodes -->
  <g font-family="'JetBrains Mono',ui-monospace,monospace">
    <!-- left -->
    <g>
      <rect x="150" y="173" width="150" height="54" rx="12" fill="#131c30" stroke="#6366F1" stroke-opacity="0.6"/>
      <circle cx="172" cy="200" r="5" fill="#818CF8"/>
      <text x="188" y="196" font-size="14" fill="#E7ECF5">web-app</text>
      <text x="188" y="214" font-size="11" fill="#8B96A9">xss · ssrf · idor</text>
    </g>
    <g>
      <rect x="108" y="248" width="150" height="54" rx="12" fill="#131c30" stroke="#6366F1" stroke-opacity="0.6"/>
      <circle cx="130" cy="275" r="5" fill="#818CF8"/>
      <text x="146" y="271" font-size="14" fill="#E7ECF5">api</text>
      <text x="146" y="289" font-size="11" fill="#8B96A9">BOLA · JWT · gql</text>
    </g>
    <g>
      <rect x="150" y="323" width="150" height="54" rx="12" fill="#131c30" stroke="#6366F1" stroke-opacity="0.6"/>
      <circle cx="172" cy="350" r="5" fill="#818CF8"/>
      <text x="188" y="346" font-size="14" fill="#E7ECF5">source</text>
      <text x="188" y="364" font-size="11" fill="#8B96A9">SAST · secrets</text>
    </g>
    <!-- right -->
    <g>
      <rect x="700" y="173" width="150" height="54" rx="12" fill="#131c30" stroke="#22D3EE" stroke-opacity="0.6"/>
      <circle cx="722" cy="200" r="5" fill="#22D3EE"/>
      <text x="738" y="196" font-size="14" fill="#E7ECF5">android</text>
      <text x="738" y="214" font-size="11" fill="#8B96A9">MASVS · ipc</text>
    </g>
    <g>
      <rect x="742" y="248" width="150" height="54" rx="12" fill="#131c30" stroke="#22D3EE" stroke-opacity="0.6"/>
      <circle cx="764" cy="275" r="5" fill="#22D3EE"/>
      <text x="780" y="271" font-size="14" fill="#E7ECF5">ios</text>
      <text x="780" y="289" font-size="11" fill="#8B96A9">keychain · ATS</text>
    </g>
    <g>
      <rect x="700" y="323" width="150" height="54" rx="12" fill="#131c30" stroke="#22D3EE" stroke-opacity="0.6"/>
      <circle cx="722" cy="350" r="5" fill="#22D3EE"/>
      <text x="738" y="346" font-size="14" fill="#E7ECF5">web3</text>
      <text x="738" y="364" font-size="11" fill="#8B96A9">reentrancy</text>
    </g>
  </g>

  <!-- center hub -->
  <g filter="url(#soft)">
    <rect x="405" y="233" width="190" height="84" rx="16" fill="#0e1830" stroke="url(#hub)" stroke-width="2">
      <animate attributeName="stroke-opacity" values="1;0.5;1" dur="2.6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="500" y="266" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" letter-spacing="2" fill="#67E8F9">ORCHESTRATOR</text>
  <text x="500" y="290" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="15" font-weight="600" fill="#F5F7FA">confirms scope</text>
  <text x="500" y="308" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#8B96A9">then routes &amp; validates</text>

  <text x="500" y="212" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#8B96A9">"help me test this in-scope target"</text>

  <text x="500" y="440" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#5f6b80">Map → Prioritize → Probe → Prove → Report  ·  every finding climbs the Trinet Validation Ladder</text>
</svg>
