<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600" role="img" aria-label="TrinetLayer Bug-Hunting Skills for Claude Code — nine skills plus recon automation">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1729"/><stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="ic" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366F1"/><stop offset="0.55" stop-color="#818CF8"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#6366F1" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <radialGradient id="spot" cx="0.2" cy="0.25" r="0.9">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.20"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="lblue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#1D4ED8"/></linearGradient>
    <linearGradient id="lgold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBBF24"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
    <linearGradient id="lrim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
    <clipPath id="lshield"><path d="M100 16 L34 40 C30 41 27 44 27 49 L27 116 C27 159 62 189 100 206 C138 189 173 159 173 116 L173 49 C173 44 170 41 166 40 Z"/></clipPath>
  </defs>

  <rect width="1280" height="600" rx="18" fill="url(#ink)"/>
  <rect width="1280" height="600" rx="18" fill="url(#grid)"/>
  <rect width="1280" height="600" rx="18" fill="url(#spot)"/>
  <rect x="0.5" y="0.5" width="1279" height="599" rx="18" fill="none" stroke="#22D3EE" stroke-opacity="0.16"/>

  <!-- radar, right -->
  <g stroke="#22D3EE" fill="none" opacity="0.15">
    <circle cx="1075" cy="235" r="48"/><circle cx="1075" cy="235" r="90"/><circle cx="1075" cy="235" r="132"/>
    <line x1="1075" y1="103" x2="1075" y2="367"/><line x1="943" y1="235" x2="1207" y2="235"/>
  </g>
  <line x1="1075" y1="235" x2="1075" y2="115" stroke="#67E8F9" stroke-width="2.5" stroke-linecap="round" opacity="0.65">
    <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 1075 235" to="360 1075 235" dur="5s" repeatCount="indefinite"/>
  </line>
  <circle cx="1075" cy="235" r="5" fill="#22D3EE" filter="url(#glow)"/>

  <!-- TrinetLayer shield logo -->
  <ellipse cx="150" cy="230" rx="128" ry="94" fill="#2563EB" opacity="0.14">
    <animate attributeName="opacity" values="0.09;0.24;0.09" dur="3.4s" repeatCount="indefinite"/>
  </ellipse>
  <g transform="translate(53,118) scale(0.96)">
    <g clip-path="url(#lshield)">
      <rect x="0" y="0" width="200" height="220" fill="url(#lblue)"/>
      <polygon points="150,-10 210,-10 210,230 66,230" fill="url(#lgold)"/>
    </g>
    <path d="M100 16 L34 40 C30 41 27 44 27 49 L27 116 C27 159 62 189 100 206 C138 189 173 159 173 116 L173 49 C173 44 170 41 166 40 Z" fill="none" stroke="url(#lrim)" stroke-width="5" stroke-opacity="0.9"/>
    <polygon points="110,58 70,120 97,120 88,172 132,102 104,102" fill="#FFFFFF" stroke="#E8EEF9" stroke-width="1"/>
  </g>

  <!-- headline -->
  <text x="292" y="118" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="16" letter-spacing="4" fill="#67E8F9">TRINETLAYER · ATTACK SURFACE LAB</text>
  <text x="290" y="192" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="62" font-weight="700" fill="#F5F7FA" letter-spacing="-1.5">Bug-Hunting Skills</text>
  <text x="292" y="256" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="62" font-weight="700" letter-spacing="-1.5" fill="url(#ic)">for Claude Code</text>
  <text x="294" y="300" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="20" fill="#9AA6B8">Nine model-invoked skills + recon automation for authorized security research.</text>

  <!-- skill constellation -->
  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13" fill="#C7D0E0">
    <g><rect x="292" y="338" width="158" height="32" rx="9" fill="#101a30" stroke="url(#ic)" stroke-width="1.3"/><text x="371" y="359" text-anchor="middle" fill="#E7ECF5">orchestrator</text></g>
    <g><rect x="460" y="338" width="66" height="32" rx="9" fill="#141d31" stroke="#6366F1" stroke-opacity="0.55"/><text x="493" y="359" text-anchor="middle">web</text></g>
    <g><rect x="536" y="338" width="60" height="32" rx="9" fill="#141d31" stroke="#6366F1" stroke-opacity="0.55"/><text x="566" y="359" text-anchor="middle">api</text></g>
    <g><rect x="606" y="338" width="86" height="32" rx="9" fill="#141d31" stroke="#6366F1" stroke-opacity="0.55"/><text x="649" y="359" text-anchor="middle">source</text></g>
    <g><rect x="702" y="338" width="92" height="32" rx="9" fill="#141d31" stroke="#22D3EE" stroke-opacity="0.55"/><text x="748" y="359" text-anchor="middle">android</text></g>

    <g><rect x="292" y="380" width="60" height="32" rx="9" fill="#141d31" stroke="#22D3EE" stroke-opacity="0.55"/><text x="322" y="401" text-anchor="middle">ios</text></g>
    <g><rect x="362" y="380" width="64" height="32" rx="9" fill="#141d31" stroke="#C4B5FD" stroke-opacity="0.55"/><text x="394" y="401" text-anchor="middle">evm</text></g>
    <g><rect x="436" y="380" width="86" height="32" rx="9" fill="#141d31" stroke="#C4B5FD" stroke-opacity="0.6"/><text x="479" y="401" text-anchor="middle">solana</text></g>
    <g><rect x="532" y="380" width="78" height="32" rx="9" fill="#141d31" stroke="#67E8F9" stroke-opacity="0.6"/><text x="571" y="401" text-anchor="middle">move</text></g>
    <g><rect x="620" y="380" width="174" height="32" rx="9" fill="#0e2233" stroke="#34D399" stroke-opacity="0.6"/><text x="707" y="401" text-anchor="middle" fill="#8FE9C8">recon automation</text></g>
  </g>

  <!-- workflow ribbon -->
  <rect x="40" y="470" width="1200" height="1" fill="#22D3EE" opacity="0.14"/>
  <text x="640" y="512" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="600" fill="#DCE3EF">
    Map <tspan fill="#67E8F9">→</tspan> Prioritize <tspan fill="#67E8F9">→</tspan> Probe <tspan fill="#67E8F9">→</tspan> Prove <tspan fill="#67E8F9">→</tspan> Report
  </text>
  <text x="640" y="542" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13" fill="#7f8ba1">every finding climbs the 8-rung Trinet Validation Ladder</text>
  <text x="640" y="576" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#5a6579">learn · hunt · test · automate — app.trinetlayer.com</text>
</svg>
