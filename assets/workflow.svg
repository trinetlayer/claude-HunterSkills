<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 350" width="1040" height="350" role="img" aria-label="Workflow: Map, Prioritize, Probe, Prove, Report, with the eight-rung Trinet Validation Ladder">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1526"/><stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#6366F1" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1040" height="350" rx="16" fill="url(#ink)"/>
  <rect width="1040" height="350" rx="16" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1039" height="349" rx="16" fill="none" stroke="#22D3EE" stroke-opacity="0.14"/>

  <text x="40" y="46" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13" letter-spacing="3" fill="#67E8F9">WORKFLOW</text>

  <!-- pipeline arrows -->
  <g stroke="url(#flow)" stroke-width="2.5" fill="none" opacity="0.8">
    <path d="M196 100 H224"/><path d="M396 100 H424"/><path d="M596 100 H624"/><path d="M796 100 H824"/>
  </g>
  <g fill="#22D3EE">
    <polygon points="224,94 236,100 224,106" opacity="0.35"><animate attributeName="opacity" values="0.35;1;0.35" dur="2s" begin="0s" repeatCount="indefinite"/></polygon>
    <polygon points="424,94 436,100 424,106" opacity="0.35"><animate attributeName="opacity" values="0.35;1;0.35" dur="2s" begin="0.4s" repeatCount="indefinite"/></polygon>
    <polygon points="624,94 636,100 624,106" opacity="0.35"><animate attributeName="opacity" values="0.35;1;0.35" dur="2s" begin="0.8s" repeatCount="indefinite"/></polygon>
    <polygon points="824,94 836,100 824,106" opacity="0.35"><animate attributeName="opacity" values="0.35;1;0.35" dur="2s" begin="1.2s" repeatCount="indefinite"/></polygon>
  </g>

  <!-- nodes -->
  <g font-family="Inter,system-ui,sans-serif">
    <g>
      <rect x="30" y="72" width="164" height="58" rx="12" fill="#131c30" stroke="#6366F1" stroke-opacity="0.7"/>
      <text x="112" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#EEF1F7">Map</text>
      <text x="112" y="119" text-anchor="middle" font-size="11" fill="#8B96A9" font-family="'JetBrains Mono',monospace">recon · surface</text>
    </g>
    <g>
      <rect x="230" y="72" width="164" height="58" rx="12" fill="#131c30" stroke="#6C6DF0" stroke-opacity="0.7"/>
      <text x="312" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#EEF1F7">Prioritize</text>
      <text x="312" y="119" text-anchor="middle" font-size="11" fill="#8B96A9" font-family="'JetBrains Mono',monospace">rank by impact</text>
    </g>
    <g>
      <rect x="430" y="72" width="164" height="58" rx="12" fill="#131c30" stroke="#7B9BF3" stroke-opacity="0.7"/>
      <text x="512" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#EEF1F7">Probe</text>
      <text x="512" y="119" text-anchor="middle" font-size="11" fill="#8B96A9" font-family="'JetBrains Mono',monospace">test high-impact</text>
    </g>
    <g>
      <rect x="630" y="72" width="164" height="58" rx="12" fill="#101d33" stroke="#22D3EE" stroke-width="2">
        <animate attributeName="stroke-opacity" values="1;0.45;1" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <text x="712" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#EEF1F7">Prove</text>
      <text x="712" y="119" text-anchor="middle" font-size="11" fill="#67E8F9" font-family="'JetBrains Mono',monospace">climb the Ladder</text>
    </g>
    <g>
      <rect x="830" y="72" width="164" height="58" rx="12" fill="#131c30" stroke="#22D3EE" stroke-opacity="0.8"/>
      <text x="912" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#EEF1F7">Report</text>
      <text x="912" y="119" text-anchor="middle" font-size="11" fill="#8B96A9" font-family="'JetBrains Mono',monospace">impact-first</text>
    </g>
  </g>

  <!-- connector from Prove down to ladder -->
  <path d="M712 130 V150" stroke="#22D3EE" stroke-width="2" opacity="0.6"/>

  <!-- Trinet Validation Ladder -->
  <text x="600" y="176" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" letter-spacing="2" fill="#67E8F9">TRINET VALIDATION LADDER — 8 RUNGS</text>
  <g stroke="url(#flow)" stroke-width="3">
    <line x1="600" y1="188" x2="600" y2="326"/>
    <line x1="672" y1="188" x2="672" y2="326"/>
  </g>
  <g stroke="#9AA6B8" stroke-width="2" opacity="0.85">
    <line x1="600" y1="198" x2="672" y2="198"/>
    <line x1="600" y1="216" x2="672" y2="216"/>
    <line x1="600" y1="234" x2="672" y2="234"/>
    <line x1="600" y1="252" x2="672" y2="252"/>
    <line x1="600" y1="270" x2="672" y2="270"/>
    <line x1="600" y1="288" x2="672" y2="288"/>
    <line x1="600" y1="306" x2="672" y2="306"/>
    <line x1="600" y1="324" x2="672" y2="324"/>
  </g>
  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#C7D0E0">
    <text x="688" y="202">real class</text>
    <text x="688" y="220">reachable</text>
    <text x="688" y="238">exploitable now</text>
    <text x="688" y="256">concrete impact</text>
    <text x="688" y="274">in scope</text>
    <text x="688" y="292">reproducible</text>
    <text x="688" y="310">not a duplicate</text>
    <text x="688" y="328">evidence captured</text>
  </g>

  <text x="40" y="206" font-family="Inter,system-ui,sans-serif" font-size="15" font-weight="600" fill="#E7ECF5">Discipline, not volume.</text>
  <text x="40" y="232" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#8B96A9">A handful of validated,</text>
  <text x="40" y="250" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#8B96A9">high-impact findings beats</text>
  <text x="40" y="268" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#8B96A9">a pile of unvalidated noise.</text>
  <text x="40" y="300" font-family="'JetBrains Mono',monospace" font-size="12" fill="#5f6b80">break. test. learn.</text>
</svg>
