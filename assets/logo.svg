<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220" role="img" aria-label="TrinetLayer logo — blue and gold shield with a lightning bolt">
  <defs>
    <linearGradient id="blue" x1="0.15" y1="0.05" x2="0.8" y2="1">
      <stop offset="0" stop-color="#4C93F7"/><stop offset="0.55" stop-color="#2F6BEA"/><stop offset="1" stop-color="#1E52D6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FCD34D"/><stop offset="1" stop-color="#F0A81E"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0.15">
      <stop offset="0" stop-color="#3B7BEF"/><stop offset="0.5" stop-color="#4C93F7"/><stop offset="0.62" stop-color="#F6C24A"/><stop offset="1" stop-color="#EDA017"/>
    </linearGradient>
    <clipPath id="shield">
      <path d="M100 14 L36 38 C31 40 28 43 28 49 L28 116 C28 160 63 191 100 208 C137 191 172 160 172 116 L172 49 C172 43 169 40 164 38 Z"/>
    </clipPath>
    <filter id="ds" x="-25%" y="-20%" width="150%" height="145%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1E52D6" flood-opacity="0.30"/>
    </filter>
  </defs>

  <g filter="url(#ds)">
    <g clip-path="url(#shield)">
      <!-- blue base -->
      <rect x="0" y="0" width="200" height="220" fill="url(#blue)"/>
      <!-- gold rounded patch, top-right -->
      <path d="M103 44 Q101 40 106 39 L160 51 Q167 53 167 60 L167 104 Q167 111 160 110 L112 100 Q104 98 104 90 Z" fill="url(#gold)"/>
      <!-- gold lower-right sliver (rim inner) -->
      <path d="M172 60 L172 116 C172 150 152 176 126 192 L120 150 L150 118 Z" fill="url(#gold)" opacity="0.9"/>
      <!-- soft top-left sheen -->
      <path d="M100 14 L36 38 C31 40 28 43 28 49 L28 100 C60 70 90 46 100 40 Z" fill="#FFFFFF" opacity="0.06"/>
    </g>
    <!-- rim: blue on the left, gold on the right -->
    <path d="M100 14 L36 38 C31 40 28 43 28 49 L28 116 C28 160 63 191 100 208 C137 191 172 160 172 116 L172 49 C172 43 169 40 164 38 Z"
          fill="none" stroke="url(#rim)" stroke-width="5" stroke-linejoin="round"/>
    <!-- top centre fold -->
    <path d="M100 15 L100 42" stroke="#1B48C4" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round"/>
  </g>

  <!-- lightning bolt -->
  <polygon points="112,56 71,120 96,120 86,176 131,104 104,104" fill="#FFFFFF"/>
  <polygon points="112,56 104,104 131,104" fill="#EAF1FC"/>
</svg>
