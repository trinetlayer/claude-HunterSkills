<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220" role="img" aria-label="TrinetLayer logo">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBBF24"/><stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <clipPath id="shield">
      <path d="M100 16 L34 40 C30 41 27 44 27 49 L27 116 C27 159 62 189 100 206 C138 189 173 159 173 116 L173 49 C173 44 170 41 166 40 Z"/>
    </clipPath>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1D4ED8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#ds)">
    <g clip-path="url(#shield)">
      <rect x="0" y="0" width="200" height="220" fill="url(#blue)"/>
      <polygon points="150,-10 210,-10 210,230 66,230" fill="url(#gold)"/>
    </g>
    <!-- rim -->
    <path d="M100 16 L34 40 C30 41 27 44 27 49 L27 116 C27 159 62 189 100 206 C138 189 173 159 173 116 L173 49 C173 44 170 41 166 40 Z"
          fill="none" stroke="url(#rim)" stroke-width="5" stroke-opacity="0.9"/>
  </g>

  <!-- lightning bolt -->
  <polygon points="110,58 70,120 97,120 88,172 132,102 104,102" fill="#FFFFFF"
           stroke="#E8EEF9" stroke-width="1"/>
</svg>
