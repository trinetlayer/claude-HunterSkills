  <path d="M8 22 a14 14 0 0 1 14 -14 h896 a14 14 0 0 1 14 14 v26 h-924 z" fill="url(#bar)"/>
  <circle cx="34" cy="30" r="6" fill="#EF4444"/>
  <circle cx="56" cy="30" r="6" fill="#F5B140"/>
  <circle cx="78" cy="30" r="6" fill="#34D399"/>
