    <text x="204" y="290" fill="#34D399">✓</text>
    <text x="228" y="290" fill="#8FA0B6">reachable</text>
    <text x="322" y="290" fill="#34D399">✓</text>
    <text x="346" y="290" fill="#8FA0B6">exploitable now</text>
    <text x="486" y="290" fill="#34D399">✓</text>
