      <stop offset="0" stop-color="#12203a"/><stop offset="1" stop-color="#0e1830"/>
    </linearGradient>
    <filter id="win" x="-6%" y="-6%" width="112%" height="112%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#6366F1" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g filter="url(#win)">
